name: Build and Release .EXE

on:
  push:
    tags:
      - 'v*'  # Triggers whenever you push a tag starting with v (e.g., v1.3.0)
  workflow_dispatch: # Allows you to also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller endorser.spec

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
